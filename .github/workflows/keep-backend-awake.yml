name: Keep Render Backend Awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --retry 3 --max-time 30 https://kenya-health-dashboard-api.onrender.com/health
